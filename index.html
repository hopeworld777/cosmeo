<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon — sparkle icon, primary theme color -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS home screen icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- PWA manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b5cf6" />
    <title>Cosmeo — Cosplay Marketplace</title>
    <meta name="description" content="Buy and rent cosplay costumes, props, and accessories from the community." />
    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      // Default is "dark" (Dark Cosmos) — matches src/context/ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem("kosmeo_theme");
          var isDark = stored ? stored === "dark" : true;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
